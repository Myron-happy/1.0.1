<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vig - 关于</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #464646; /* 与天气页面完全一致的深灰色背景 */
            font-family: sans-serif;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 标题样式 */
        .about-title {
            color: skyblue;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(135, 206, 235, 0.6);
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        /* 内容卡片 */
        .about-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(135, 206, 235, 0.25);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(135, 206, 235, 0.1);
            transition: all 0.4s ease;
            animation: fadeInUp 0.8s ease-out;
        }

        /* 卡片悬停特效 */
        .about-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(135, 206, 235, 0.3);
            border-color: rgba(135, 206, 235, 0.5);
        }

        /* 文本段落 */
        .about-card p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            line-height: 2;
            margin-bottom: 20px;
            position: relative;
            padding-left: 20px;
        }

        /* 文本左侧的小圆点装饰 */
        .about-card p::before {
            content: '';
            position: absolute;
            left: 0;
            top: 14px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: skyblue;
            box-shadow: 0 0 8px skyblue;
        }

        /* 版本号高亮 */
        .highlight-version {
            color: skyblue;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(135, 206, 235, 0.6);
        }

        /* 制作不易的感谢语 */
        .thanks-text {
            color: #ff9f43;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
            margin-bottom: 0;
            padding-left: 0;
            font-size: 17px;
            text-shadow: 0 0 10px rgba(255, 159, 67, 0.4);
        }
        .thanks-text::before { display: none; } /* 去掉这行的圆点装饰 */

        /* 返回首页按钮 */
        .back-link {
            margin-top: 40px;
            animation: fadeInUp 1s ease-out;
        }
        .back-link a {
            color: skyblue;
            text-decoration: none;
            font-size: 16px;
            padding: 12px 30px;
            border: 1px solid rgba(135, 206, 235, 0.4);
            border-radius: 25px;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .back-link a:hover {
            background: rgba(135, 206, 235, 0.15);
            box-shadow: 0 0 20px rgba(135, 206, 235, 0.6);
            transform: scale(1.05);
        }

        /* 页面入场动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .about-title { font-size: 26px; }
            .about-card { padding: 25px 20px; }
            .about-card p { font-size: 15px; }
        }
		        /* ================= 关于页面的主题适配 ================= */
		        body.theme-dark { background: #121212 !important; }
		        body.theme-light { background: #f5f5f5 !important; color: #333 !important; }
		
		        /* 纯黑模式 */
		        body.theme-dark .about-title { color: skyblue; text-shadow: 0 0 15px rgba(135, 206, 235, 0.4); }
		        body.theme-dark .about-card { background: rgba(255, 255, 255, 0.05); border-color: #333; }
		        
		        /* 纯白模式 */
		        body.theme-light .about-title { color: #009dff; text-shadow: none; }
		        body.theme-light .about-card { background: rgba(0, 0, 0, 0.05); border-color: #ddd; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
		        body.theme-light .about-card p { color: #555; }
		        body.theme-light .about-card p::before { background-color: #009dff; box-shadow: none; }
		        body.theme-light .highlight-version { color: #009dff; text-shadow: none; }
		        body.theme-light .thanks-text { color: #d35400; text-shadow: none; }
		        body.theme-light .back-link a { color: #009dff; border-color: #009dff; }
		        body.theme-light .back-link a:hover { background: #009dff; color: #fff; }
		        
		        /* 右下角设置按钮的样式 */
		        #settings-wrapper { position: fixed; bottom: 30px; right: 30px; z-index: 9999; font-family: sans-serif; }
		        #settings-btn { width: 50px; height: 50px; border-radius: 50%; background: #333; color: white; border: 2px solid skyblue; cursor: pointer; font-size: 24px; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); }
		        #settings-btn:hover { background: skyblue; color: #333; transform: rotate(90deg) scale(1.1); }
		        #settings-menu { display: none; position: absolute; bottom: 65px; right: 0; background: #2a2a2a; padding: 15px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0, 0, 0, 0.8); border: 1px solid skyblue; width: 140px; }
		        #settings-menu h4 { margin: 0 0 10px 0; color: white; font-size: 14px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 8px; }
		        .theme-option { display: block; width: 100%; padding: 10px; margin-bottom: 5px; background: transparent; color: white; border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; text-align: left; }
		        .theme-option:hover { background: rgba(135, 206, 235, 0.2); color: skyblue; padding-left: 15px; }
    </style>
</head>
<body>

    <h1 class="about-title">✨ 关于 Vig网站</h1>

    <div class="about-card">
        <p>欢迎来到 <span class="highlight-version">Vig官方网站 1.0.1 正式版</span>！</p>
        <p>这个页面的功能虽然很少，但是做得非常精细，并且加入了很多流畅的视觉特效，希望能给你带来舒适的浏览体验。</p>
        <p>天气页面调用了 <strong>Open-Meteo</strong> 平台，可以实时获取并自动刷新未来一周的天气数据。</p>
        <p>为了做好天气和网站的各种细节，首页代码足足写了 700 多行，每一个特效都经过了反复的调试。</p>
        <p class="thanks-text">制作不易，谢谢大家的支持！❤️</p>
    </div>

    <div class="back-link">
        <a href="index.html">← 返回首页</a>
    </div>

</body>
    <div id="settings-wrapper">
        <button id="settings-btn" title="设置">⚙️</button>
        <div id="settings-menu">
            <h4>🎨 页面风格</h4>
            <button class="theme-option" data-theme="default">🔄 默认</button>
            <button class="theme-option" data-theme="dark">🌑 纯黑</button>
            <button class="theme-option" data-theme="light">☀️ 纯白</button>
        </div>
    </div>
</html>

<script>
	// 读取并应用主题
	        const savedTheme = localStorage.getItem('vigTheme');
	        if (savedTheme && savedTheme !== 'default') {
	            document.body.classList.add('theme-' + savedTheme);
	        }
	
	        // 设置菜单逻辑
	        const settingsBtn = document.getElementById('settings-btn');
	        const settingsMenu = document.getElementById('settings-menu');
	        const themeOptions = document.querySelectorAll('.theme-option');
	
	        settingsBtn.addEventListener('click', (e) => {
	            e.stopPropagation();
	            settingsMenu.style.display = settingsMenu.style.display === 'block' ? 'none' : 'block';
	        });
	
	        document.addEventListener('click', (e) => {
	            if (!document.getElementById('settings-wrapper').contains(e.target)) {
	                settingsMenu.style.display = 'none';
	            }
	        });
	
	        themeOptions.forEach(opt => {
	            opt.addEventListener('click', function() {
	                const theme = this.getAttribute('data-theme');
	                document.body.classList.remove('theme-dark', 'theme-light');
	                if (theme !== 'default') {
	                    document.body.classList.add('theme-' + theme);
	                }
	                localStorage.setItem('vigTheme', theme);
	                settingsMenu.style.display = 'none';
	            });
	        });
</script>
